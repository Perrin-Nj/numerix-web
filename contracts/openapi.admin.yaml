openapi: 3.1.0
info:
  title: Numerix Platform Admin API
  version: 0.1.0
  summary: Super-admin API used only by the separate admin app (admin/).
  description: |
    Base path `/admin/v1`. Never reachable from the kid and parent app origin.

    **Auth.** Every call carries `Authorization: Bearer <ADMIN_API_TOKEN>` (a long random secret shared with the
    admin app server, compared in constant time). A missing or wrong token is 401 `unauthorized`. When no token is
    configured in production the whole API answers 503 `admin_disabled`.

    **CORS.** Only the origins in `ADMIN_ORIGIN` (comma separated) get `Access-Control-Allow-Origin`; the admin app
    calls server to server, so browsers should never need it. Preflight (OPTIONS) answers 204.

    **Audit (Law 25).** Every mutation and every read of a child record (`child.read`, `child.activity.read`,
    `children.list`) appends an `AuditEntry` with the actor from header `x-admin-actor` (default `admin`).
    Audit rows are append-only and kept 12 months at least.

    **Paging.** List endpoints take `page` (from 1) and `page_size` (1 to 100, default 20) and answer
    `{items, page, page_size, total}`.

    **Errors.** `application/problem+json` with `code`: `unauthorized`, `admin_disabled`, `invalid_json`,
    `validation_failed`, `not_found`, `internal_error`, `rate_limited`.
servers:
  - url: http://localhost:8081/admin/v1
    description: Numerix Go API
tags:
  - name: Overview
  - name: Parents
  - name: Children
  - name: Plans
  - name: Config
  - name: Notifications
  - name: Audit
  - name: Content

security:
  - adminBearer: []

paths:
  /overview:
    get:
      tags: [Overview]
      operationId: adminOverview
      summary: Dashboard numbers and series
      description: Definitions of every field are in BACKEND_INTEGRATION.md (analytics series). Computed from stored records, nothing hard-coded.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '200':
          description: Overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overview' }

  /parents:
    get:
      tags: [Parents]
      operationId: adminListParents
      summary: Parent accounts, filterable and paged
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, blocked] } }
        - { name: subscription, in: query, description: Effective subscription status, schema: { type: string, enum: [trial, active, unpaid, expired, canceled] } }
        - { name: plan, in: query, description: 'Plan id. The API filters on it.', schema: { type: string, enum: [free, family_monthly, family_yearly] } }
        - { name: q, in: query, description: Case-insensitive match on name or email, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '200':
          description: A page of parents, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Parent' } }

  /parents/{parentId}:
    parameters:
      - $ref: '#/components/parameters/ParentId'
    get:
      tags: [Parents]
      operationId: adminGetParent
      summary: One parent with the list of children
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '200':
          description: The parent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parent' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Parents]
      operationId: adminUpdateParent
      summary: Block, unblock, mark paid or unpaid, extend, rename
      description: |
        All fields optional. `status: blocked` records `blocked_at` and `blocked_reason` (default
        "Blocked by admin", max 200 chars); `status: active` clears the reason. `subscription.status`:
        `active` or `paid` makes the parent paid (free plan becomes family_monthly, period restarts when not already
        running), `unpaid` marks unpaid; both set `marked_by_admin`. `extend_days` pushes `trial_ends_at` (trial)
        or `renews_at` from max(now, current end).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParentPatch' }
            examples:
              block: { value: { status: blocked, blocked_reason: Chargeback signalé par la banque } }
              paid: { value: { subscription: { status: paid, plan: family_yearly } } }
              extend: { value: { subscription: { extend_days: 14 } } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '200':
          description: Updated parent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parent' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Parents]
      operationId: adminDeleteParent
      summary: Delete a parent and everything that belongs to them
      description: Cascade (children, sessions, progress, cards, notifications, push subscriptions, consents, payment links). Processor customer is deleted too. Audited as `parent.delete`.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /children:
    get:
      tags: [Children]
      operationId: adminListChildren
      summary: Children across all parents
      description: Audited as `children.list` with the filters in `detail`.
      parameters:
        - { name: parent, in: query, description: Parent id, schema: { type: string } }
        - { name: q, in: query, description: Case-insensitive match on display name, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '200':
          description: A page of children, most recently seen first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AdminChild' } }

  /children/{childId}:
    parameters:
      - $ref: '#/components/parameters/ChildId'
    get:
      tags: [Children]
      operationId: adminGetChild
      summary: One child with parent and stats
      description: Audited as `child.read`.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '200':
          description: The child
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminChild' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Children]
      operationId: adminUpdateChild
      summary: Edit name, grade, avatar and settings
      description: Settings may be sent nested in `settings` or flat for `daily_time_limit_minutes` and `kid_can_change_language`. Audited as `child.update`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChildPatch' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '200':
          description: Updated child
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminChild' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /children/{childId}/activity:
    parameters:
      - $ref: '#/components/parameters/ChildId'
    get:
      tags: [Children]
      operationId: adminChildActivity
      summary: Last 10 sessions, cards and mastered skills
      description: Audited as `child.activity.read`.
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '200':
          description: Activity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        '404': { $ref: '#/components/responses/NotFound' }

  /subscriptions/plans:
    get:
      tags: [Plans]
      operationId: adminGetPlans
      summary: Plans and payment methods
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '200':
          description: Catalogue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanCatalog' }
    put:
      tags: [Plans]
      operationId: adminPutPlans
      summary: Replace prices, names, features and the list of payment methods
      description: Must contain exactly free, family_monthly and family_yearly. Parents see the new prices at once. Audited as `plans.update`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanCatalog' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanCatalog' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /config:
    get:
      tags: [Config]
      operationId: adminGetConfig
      summary: Platform configuration
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '200':
          description: Config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformConfig' }
    put:
      tags: [Config]
      operationId: adminPutConfig
      summary: Merge changes into the configuration
      description: Partial body allowed; each key is validated against its limits. Audited as `config.update`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformConfig' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '200':
          description: The full configuration after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformConfig' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /appconfig:
    get:
      tags: [Config]
      operationId: adminListAppConfig
      summary: Every runtime-config namespace with its version, plus the environment-only settings (read-only)
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '200':
          description: Namespaces and env view
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [namespaces, env]
                properties:
                  namespaces: { type: array, items: { type: object, additionalProperties: true } }
                  env: { type: array, items: { type: object, additionalProperties: true } }

  /appconfig/{ns}:
    parameters:
      - { name: ns, in: path, required: true, schema: { type: string, example: music } }
    get:
      tags: [Config]
      operationId: adminGetAppConfig
      summary: One namespace - current value, version and built-in defaults
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '200':
          description: The document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppConfigDoc' }
    put:
      tags: [Config]
      operationId: adminPutAppConfig
      summary: Replace a namespace (validated; optimistic version check)
      description: Audited as `appconfig.set` with the actor from `x-admin-actor`. 409 `version_conflict` when `expected_version` is stale.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: object, additionalProperties: true }
                expected_version: { type: integer, minimum: 0 }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'version_conflict', content: { application/problem+json: { schema: { type: object, additionalProperties: true } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '200':
          description: The saved document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppConfigDoc' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /appconfig/{ns}/versions:
    parameters:
      - { name: ns, in: path, required: true, schema: { type: string } }
    get:
      tags: [Config]
      operationId: adminAppConfigVersions
      summary: History of a namespace, newest first
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '200':
          description: Versions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { type: object, additionalProperties: true } }

  /appconfig/{ns}/rollback:
    parameters:
      - { name: ns, in: path, required: true, schema: { type: string } }
    post:
      tags: [Config]
      operationId: adminRollbackAppConfig
      summary: Save the previous (or a chosen) version as a new version
      description: Audited as `appconfig.rollback`. 409 `nothing_to_roll_back` when there is no earlier version.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                to_version: { type: integer, minimum: 1 }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'nothing_to_roll_back', content: { application/problem+json: { schema: { type: object, additionalProperties: true } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '200':
          description: The new current document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppConfigDoc' }

  /notifications:
    get:
      tags: [Notifications]
      operationId: adminListNotifications
      summary: Sent notifications, broadcasts grouped into one row
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '200':
          description: A page of notification rows, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/BroadcastRow' } }

  /notifications/broadcast:
    post:
      tags: [Notifications]
      operationId: adminBroadcast
      summary: Send an announcement to a filtered set of parents
      description: |
        `title` and `body` are a string or `{fr, en}`; each parent receives their own locale. `filter` keys are
        optional and each takes one value or a list: `subscription` (effective status), `status`, `locale`, `plan`,
        `parent_ids`. Audited as `notification.broadcast`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BroadcastRequest' }
            example:
              audience: parent
              title: { fr: Nouveau monde, en: New world }
              body: { fr: Le monde Espace est ouvert., en: The Space world is open. }
              filter: { subscription: [active, trial] }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [broadcast_id, recipients]
                properties:
                  broadcast_id: { type: string }
                  recipients: { type: integer }
        '422': { $ref: '#/components/responses/ValidationError' }

  /audit:
    get:
      tags: [Audit]
      operationId: adminAudit
      summary: Audit log, newest first
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '200':
          description: A page of entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }

  # ---- Content: question bank, worlds, quests, coverage, media (numerix-api docs/ADMIN_API.md, "Content") ----
  /questions:
    get:
      tags: [Content]
      operationId: adminListQuestions
      summary: Page of question summaries with filters
      parameters:
        - { name: world, in: query, schema: { type: string } }
        - { name: quest, in: query, schema: { type: string } }
        - { name: skill, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
        - { name: grade, in: query, schema: { type: integer, minimum: 1, maximum: 6 } }
        - { name: difficulty, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/QuestionStatus' } }
        - { name: author, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: q, in: query, description: Text search in the prompts., schema: { type: string } }
        - { name: ai, in: query, description: '1 keeps only AI drafts.', schema: { type: string, enum: ['1'] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '200':
          description: A page of summaries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/QuestionSummary' } }
    post:
      tags: [Content]
      operationId: adminCreateQuestion
      summary: Create a question; always saved as a draft
      description: Without `id` the next free `quest.NNN` is used. A draft with problems is saved and the issues are returned.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Question' } } } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
        '201':
          description: The saved draft
          content: { application/json: { schema: { $ref: '#/components/schemas/QuestionRecord' } } }

  /questions/validate:
    post:
      tags: [Content]
      operationId: adminValidateQuestion
      summary: Run the publish validator on a question body without saving
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Question' } } } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '200':
          description: The validation report
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationReport' } } }

  /questions/validate-all:
    post:
      tags: [Content]
      operationId: adminValidateAllQuestions
      summary: Validate every stored question (optionally one world)
      parameters:
        - { name: world, in: query, schema: { type: string } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '200':
          description: Counts and the first 500 failing questions
          content:
            application/json:
              schema:
                type: object
                required: [total, with_errors, with_warnings_only, questions]
                properties:
                  total: { type: integer }
                  with_errors: { type: integer }
                  with_warnings_only: { type: integer }
                  questions: { type: array, items: { type: object, additionalProperties: true } }
                  set_issues: { type: array, items: { type: object, additionalProperties: true } }

  /questions/ai-draft:
    post:
      tags: [Content]
      operationId: adminAiDraftQuestion
      summary: Ask the model for a draft question (503 not_configured unless the key and model are set)
      description: The server forces status draft, recomputes every `calc` and runs the validator. 30 drafts per hour per admin. The child API never calls the model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quest, type]
              properties:
                quest: { type: string }
                type: { type: string }
                grade: { type: integer, minimum: 1, maximum: 6 }
                difficulty: { type: integer }
                topic_hint: { type: string }
                language_primary: { type: string, enum: [fr, en] }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { description: 'The model call failed (code draft_failed)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '503': { description: 'AI drafts are off (code not_configured)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '201':
          description: The draft and its checks
          content:
            application/json:
              schema:
                type: object
                required: [question, unverified, needs_review, valid]
                properties:
                  question: { $ref: '#/components/schemas/QuestionRecord' }
                  unverified: { type: boolean }
                  calc_corrections: { type: array, items: { type: object, additionalProperties: true } }
                  needs_review: { type: boolean }
                  valid: { type: boolean }

  /questions/export:
    get:
      tags: [Content]
      operationId: adminExportQuestions
      summary: Export questions in the seed file shape
      parameters:
        - { name: world, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/QuestionStatus' } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '200':
          description: Seed shaped export
          content:
            application/json:
              schema:
                type: object
                required: [schema, questions]
                properties:
                  schema: { type: integer, enum: [1] }
                  world: { type: string }
                  exported_at: { type: string }
                  questions: { type: array, items: { $ref: '#/components/schemas/Question' } }

  /questions/import:
    post:
      tags: [Content]
      operationId: adminImportQuestions
      summary: Import questions (the export shape or an array); unchanged ones are left alone
      parameters:
        - { name: dry_run, in: query, schema: { type: string, enum: ['1'] } }
        - { name: publish, in: query, description: 'With 1 a valid non-AI question keeps review or published.', schema: { type: string, enum: ['1'] } }
      requestBody: { required: true, content: { application/json: { schema: { oneOf: [{ type: object, properties: { schema: { type: integer }, questions: { type: array, items: { type: object } } } }, { type: array, items: { type: object } }] } } } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '200':
          description: What was or would be written
          content:
            application/json:
              schema:
                type: object
                required: [added, changed, unchanged, invalid]
                properties:
                  dry_run: { type: boolean }
                  added: { type: integer }
                  changed: { type: integer }
                  unchanged: { type: integer }
                  invalid: { type: array, items: { type: object, properties: { index: { type: integer }, id: { type: string }, issues: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } } } } }

  /questions/{id}:
    parameters:
      - $ref: '#/components/parameters/QuestionId'
    get:
      tags: [Content]
      operationId: adminGetQuestion
      summary: One question with its versions and live validation issues
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '200':
          description: The record
          content: { application/json: { schema: { $ref: '#/components/schemas/QuestionRecord' } } }
    put:
      tags: [Content]
      operationId: adminPutQuestion
      summary: Save a new version of a question
      description: Header `If-Match` carries the version the editor loaded (409 version_conflict when stale). Editing a published question sends it back to review; a retired one answers 409.
      parameters:
        - { name: If-Match, in: header, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Question' } } } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'version_conflict or transition_not_allowed', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '200':
          description: The saved record
          content: { application/json: { schema: { $ref: '#/components/schemas/QuestionRecord' } } }

  /questions/{id}/transition:
    parameters:
      - $ref: '#/components/parameters/QuestionId'
    post:
      tags: [Content]
      operationId: adminTransitionQuestion
      summary: Move a question through the review lifecycle
      description: review and published need zero blocking issues (422, one field error per issue). An AI draft cannot be published by its own author (409 needs_reviewer).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { $ref: '#/components/schemas/QuestionStatus' }
                comment: { type: string }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'transition_not_allowed or needs_reviewer', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '200':
          description: The record after the move
          content: { application/json: { schema: { $ref: '#/components/schemas/QuestionRecord' } } }

  /questions/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/QuestionId'
    get:
      tags: [Content]
      operationId: adminListQuestionVersions
      summary: Version history of a question
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: One row per saved version
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { type: object, additionalProperties: true } } } } } }

  /questions/{id}/versions/{n}:
    parameters:
      - $ref: '#/components/parameters/QuestionId'
      - { name: n, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [Content]
      operationId: adminGetQuestionVersion
      summary: The full body of one saved version
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The snapshot
          content: { application/json: { schema: { type: object, required: [version, question], properties: { version: { type: integer }, question: { $ref: '#/components/schemas/Question' } } } } }

  /questions/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/QuestionId'
    post:
      tags: [Content]
      operationId: adminRestoreQuestionVersion
      summary: Restore an old version as a new draft version
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [version], properties: { version: { type: integer, minimum: 1 } } } } } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'version_conflict or transition_not_allowed', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '200':
          description: The record after the restore
          content: { application/json: { schema: { $ref: '#/components/schemas/QuestionRecord' } } }

  /worlds:
    get:
      tags: [Content]
      operationId: adminListWorlds
      summary: All worlds
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Worlds
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { type: object, additionalProperties: true } } } } } }

  /worlds/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [Content]
      operationId: adminPutWorld
      summary: Hotfix a world; the seed files own worlds
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '200':
          description: The merged world
          content: { application/json: { schema: { type: object, additionalProperties: true } } }

  /quests:
    get:
      tags: [Content]
      operationId: adminListQuests
      summary: Quests, optionally of one world
      parameters:
        - { name: world, in: query, schema: { type: string } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Quests
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { type: object, additionalProperties: true } } } } } }

  /quests/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [Content]
      operationId: adminPutQuest
      summary: Hotfix a quest; the seed files own quests
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '200':
          description: The merged quest
          content: { application/json: { schema: { type: object, additionalProperties: true } } }

  /content/coverage:
    get:
      tags: [Content]
      operationId: adminContentCoverage
      summary: Question counts by status and type per quest, and the missing quota per world
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Coverage
          content:
            application/json:
              schema:
                type: object
                required: [quests, worlds]
                properties:
                  quests: { type: array, items: { type: object, required: [target_count, by_status], properties: { id: { type: string }, target_count: { type: integer }, by_status: { type: object, additionalProperties: { type: integer } } }, additionalProperties: true } }
                  worlds: { type: array, items: { type: object, additionalProperties: true } }

  /assets:
    get:
      tags: [Content]
      operationId: adminListAssets
      summary: Page of media assets with filters
      parameters:
        - { name: kind, in: query, schema: { type: string } }
        - { name: world, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: licence, in: query, schema: { type: string } }
        - { name: facet, in: query, schema: { type: string } }
        - { name: value, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: A page of assets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/AdminAsset' } }
    post:
      tags: [Content]
      operationId: adminCreateAsset
      summary: Not available, answers 501 (images come from tools/assets and cmd/seed)
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { description: Not implemented, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /assets/search:
    get:
      tags: [Content]
      operationId: adminSearchAssets
      summary: Scored asset candidates for a topic
      parameters:
        - { name: world, in: query, schema: { type: string } }
        - { name: topic, in: query, schema: { type: string } }
        - { name: object, in: query, schema: { type: string } }
        - { name: mood, in: query, schema: { type: string } }
        - { name: setting, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: grade, in: query, schema: { type: integer } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Candidates, best first
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { type: object, additionalProperties: true } } } } } }

  /assets/resolve:
    get:
      tags: [Content]
      operationId: adminResolveAsset
      summary: The asset a child would get, or fallback gradient
      parameters:
        - { name: world, in: query, schema: { type: string } }
        - { name: topic, in: query, schema: { type: string } }
        - { name: child, in: query, schema: { type: string } }
        - { name: question, in: query, schema: { type: string } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: The resolved asset
          content:
            application/json:
              schema:
                type: object
                properties:
                  asset: { oneOf: [{ $ref: '#/components/schemas/AdminAsset' }, { type: 'null' }] }
                  fallback: { type: string, enum: [gradient] }

  /assets/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Content]
      operationId: adminGetAsset
      summary: One asset
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '200':
          description: The asset
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminAsset' } } }
    patch:
      tags: [Content]
      operationId: adminPatchAsset
      summary: Edit alt text, review status and safety flags
      description: Approval needs alt text in both languages, people_free and brand_free; a Pexels photo needs creator_url.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alt_fr: { type: string }
                alt_en: { type: string }
                review_status: { type: string }
                people_free: { type: boolean }
                brand_free: { type: boolean }
                tags: { type: array, items: { type: string } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '200':
          description: The updated asset
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminAsset' } } }

components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      description: ADMIN_API_TOKEN

  parameters:
    ParentId: { name: parentId, in: path, required: true, schema: { type: string } }
    ChildId: { name: childId, in: path, required: true, schema: { type: string } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    QuestionId: { name: id, in: path, required: true, schema: { type: string } }
    PageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }

  responses:
    Unauthorized:
      description: Missing or wrong admin token (code unauthorized)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Origin not allowed, or admin API disabled (code admin_disabled, 503 in that case)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such record (code not_found)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Invalid body (code validation_failed, detail names the field)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Too many requests (code rate_limited)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServerError:
      description: Store or internal failure (code internal_error)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    AppConfigDoc:
      type: object
      additionalProperties: true
      required: [name, version, value]
      properties:
        name: { type: string }
        version: { type: integer }
        updated_at: { type: string }
        updated_by: { type: string }
        value: { type: object, additionalProperties: true }
        defaults: { type: object, additionalProperties: true }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
    PageEnvelope:
      type: object
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: {} }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    Subscription:
      type: object
      required: [status, plan]
      properties:
        status: { type: string, enum: [trial, active, unpaid, expired, canceled] }
        plan: { type: string, enum: [free, family_monthly, family_yearly] }
        method: { type: string, enum: [card, interac, paypal, apple_pay, google_pay] }
        renews_at: { type: string, format: date-time }
        trial_ends_at: { type: string, format: date-time }
        marked_by_admin: { type: boolean }
        can_play: { type: boolean }
        days_left: { type: [integer, 'null'] }
    Parent:
      type: object
      required: [id, email, name, created_at, locale, status, subscription, children_count]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string, maxLength: 80 }
        created_at: { type: string, format: date-time }
        locale: { type: string, example: fr-CA }
        status: { type: string, enum: [active, blocked] }
        blocked_reason: { type: string }
        blocked_at: { type: string, format: date-time }
        subscription: { $ref: '#/components/schemas/Subscription' }
        children_count: { type: integer }
        children:
          type: array
          description: Only on the single-parent read
          items:
            type: object
            properties:
              id: { type: string }
              display_name: { type: string }
              grade: { type: integer }
              last_seen_at: { type: string, format: date-time }
      example:
        id: '99999999-9999-4999-8999-999999999999'
        email: parent@example.com
        name: Camille Demo
        created_at: '2026-09-12T14:00:00Z'
        locale: fr-CA
        status: active
        subscription: { status: trial, plan: free, trial_ends_at: '2026-10-26T14:00:00Z', can_play: true, days_left: 14 }
        children_count: 2
    ParentPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        locale: { type: string, pattern: '^[a-z]{2}-[A-Z]{2}$' }
        status: { type: string, enum: [active, blocked] }
        blocked_reason: { type: string, maxLength: 200 }
        subscription:
          type: object
          properties:
            status: { type: string, enum: [active, paid, unpaid] }
            plan: { type: string, enum: [free, family_monthly, family_yearly] }
            extend_days: { type: integer, minimum: 1, maximum: 3650 }
    ChildSettings:
      type: object
      properties:
        daily_goal_chapters: { type: integer, minimum: 1, maximum: 5 }
        daily_time_limit_minutes: { type: [integer, 'null'], minimum: 5, maximum: 180 }
        enabled_worlds: { type: array, minItems: 1, items: { type: string } }
        read_aloud: { type: boolean }
        sound: { type: boolean }
        kid_can_change_language: { type: boolean }
    AdminChild:
      type: object
      required: [id, parent_id, display_name, grade, minutes_today, sessions_total, cards_total, skills_mastered, settings]
      properties:
        id: { type: string }
        parent_id: { type: string }
        parent_name: { type: [string, 'null'], description: On the list }
        parent:
          description: On the single-child read
          oneOf:
            - { type: object, properties: { id: { type: string }, name: { type: string }, email: { type: string } } }
            - { type: 'null' }
        display_name: { type: string, maxLength: 30 }
        grade: { type: integer, minimum: 1, maximum: 6 }
        avatar_id: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        minutes_today: { type: integer }
        sessions_total: { type: integer }
        cards_total: { type: integer }
        skills_mastered: { type: integer }
        settings: { $ref: '#/components/schemas/ChildSettings' }
    ChildPatch:
      type: object
      properties:
        display_name: { type: string, minLength: 1, maxLength: 30 }
        name: { type: string, description: Alias of display_name }
        grade: { type: integer, minimum: 1, maximum: 6 }
        avatar_id: { type: string }
        daily_time_limit_minutes: { type: [integer, 'null'], minimum: 5, maximum: 180 }
        kid_can_change_language: { type: boolean }
        settings: { $ref: '#/components/schemas/ChildSettings' }
    Activity:
      type: object
      properties:
        child_id: { type: string }
        sessions:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              world: { type: string }
              skill_id: { type: string }
              skill_name: { type: string }
              started_at: { type: string, format: date-time }
              status: { type: string }
              correct: { type: integer }
              total: { type: integer }
              card_awarded: { type: boolean }
        cards:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              world: { type: string }
              name: { type: string }
              earned_at: { type: string, format: date-time }
        skills:
          type: array
          items:
            type: object
            properties:
              skill_id: { type: string }
              name: { type: string }
              mastery_pct: { type: integer, minimum: 0, maximum: 100 }
    PlanCatalog:
      type: object
      required: [plans, methods]
      properties:
        currency: { type: string, example: CAD }
        plans:
          type: array
          items:
            type: object
            required: [id, price_cad_cents, period, name, features]
            properties:
              id: { type: string, enum: [free, family_monthly, family_yearly] }
              price_cad_cents: { type: integer, minimum: 0, maximum: 1000000 }
              period: { type: string, enum: [none, month, year] }
              name: { type: object, properties: { fr: { type: string }, en: { type: string } } }
              features: { type: object, properties: { fr: { type: array, items: { type: string } }, en: { type: array, items: { type: string } } } }
        methods:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string, enum: [card, interac, paypal, apple_pay, google_pay] }
              label: { type: object, properties: { fr: { type: string }, en: { type: string } } }
    PlatformConfig:
      type: object
      properties:
        card_threshold_pct: { type: number, minimum: 0, maximum: 100, default: 70 }
        unpaid_policy: { type: string, enum: [block, allow], default: block }
        trial_days: { type: integer, minimum: 0, maximum: 365, default: 14 }
        daily_time_limit_minutes_default: { type: [integer, 'null'], minimum: 5, maximum: 180, default: 60 }
        reminder_hour_local: { type: integer, minimum: 0, maximum: 23, default: 17 }
        expiring_warning_days: { type: integer, minimum: 0, maximum: 60, default: 7 }
        default_locale: { type: string, pattern: '^[a-z]{2}-[A-Z]{2}$', default: fr-CA }
        features: { type: object, additionalProperties: { type: boolean }, example: { feed: true, challenges: true, push: false, payments: true } }
    BroadcastRequest:
      type: object
      required: [title, body]
      properties:
        audience: { type: string, enum: [parent, child], default: parent }
        title: { oneOf: [{ type: string }, { type: object, properties: { fr: { type: string }, en: { type: string } } }] }
        body: { oneOf: [{ type: string }, { type: object, properties: { fr: { type: string }, en: { type: string } } }] }
        filter:
          type: object
          properties:
            subscription: {}
            status: {}
            locale: {}
            plan: {}
            parent_ids: {}
    BroadcastRow:
      type: object
      properties:
        id: { type: string }
        kind: { type: string }
        title: { type: string }
        body: { type: string }
        created_at: { type: string, format: date-time }
        audience: { type: string, enum: [parent, child] }
        recipients: { type: integer }
        broadcast: { type: boolean }
        parent_id: { type: [string, 'null'] }
    AuditEntry:
      type: object
      required: [id, at, actor, action, target_type, target_id]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string, example: parent.block }
        target_type: { type: string, enum: [parent, child, config, plans, notification] }
        target_id: { type: string }
        detail: { type: string, maxLength: 300 }
    Overview:
      type: object
      description: Every series is defined in BACKEND_INTEGRATION.md (analytics series definitions).
      required: [parents_total, by_subscription, blocked, kids_total, active_today, mrr_cad_cents, currency, signups_30d_total, signups_by_day_30, signups_by_month_12, active_kids_by_day_30, minutes_by_day_30, sessions_by_day_30, activity_by_day_90, subscription_mix, plan_mix, mrr_by_month_12, kids_by_grade, retention, churn_30d, arpu_cad_cents, top_worlds, trend_30]
      properties:
        parents_total: { type: integer }
        by_subscription: { type: object, required: [trial, active, unpaid, expired, canceled], properties: { trial: { type: integer }, active: { type: integer }, unpaid: { type: integer }, expired: { type: integer }, canceled: { type: integer } }, additionalProperties: { type: integer } }
        blocked: { type: integer }
        kids_total: { type: integer }
        active_today: { type: integer }
        mrr_cad_cents: { type: integer }
        currency: { type: string }
        signups_30d_total: { type: integer }
        signups_by_day_30: { type: array, minItems: 30, maxItems: 30, items: { type: object, required: [date, count], properties: { date: { type: string, format: date }, count: { type: integer } } } }
        signups_by_month_12: { type: array, minItems: 12, maxItems: 12, items: { type: object, required: [month, count], properties: { month: { type: string, example: 2026-10 }, count: { type: integer } } } }
        active_kids_by_day_30: { type: array, minItems: 30, maxItems: 30, items: { $ref: '#/components/schemas/DayValue' } }
        minutes_by_day_30: { type: array, minItems: 30, maxItems: 30, items: { $ref: '#/components/schemas/DayValue' } }
        sessions_by_day_30: { type: array, minItems: 30, maxItems: 30, items: { $ref: '#/components/schemas/DayValue' } }
        activity_by_day_90: { type: array, minItems: 90, maxItems: 90, items: { type: object, required: [date, active_kids, minutes, sessions], properties: { date: { type: string, format: date }, active_kids: { type: integer }, minutes: { type: integer }, sessions: { type: integer } } } }
        subscription_mix: { type: array, minItems: 5, maxItems: 5, items: { type: object, required: [status, count], properties: { status: { type: string, enum: [trial, active, unpaid, expired, canceled] }, count: { type: integer } } } }
        plan_mix: { type: array, minItems: 3, maxItems: 3, items: { type: object, required: [plan, count, mrr_cad_cents], properties: { plan: { type: string, enum: [free, family_monthly, family_yearly] }, count: { type: integer }, mrr_cad_cents: { type: integer } } } }
        mrr_by_month_12: { type: array, minItems: 12, maxItems: 12, items: { type: object, required: [month, mrr_cad_cents], properties: { month: { type: string }, mrr_cad_cents: { type: integer } } } }
        kids_by_grade: { type: array, minItems: 6, maxItems: 6, items: { type: object, required: [grade, count], properties: { grade: { type: integer }, count: { type: integer } } } }
        retention: { type: object, required: [pct, eligible, active], properties: { pct: { type: number }, eligible: { type: integer }, active: { type: integer } } }
        churn_30d: { type: integer }
        arpu_cad_cents: { type: integer }
        top_worlds: { type: array, minItems: 8, maxItems: 8, items: { type: object, required: [world, sessions_30d], properties: { world: { type: string }, sessions_30d: { type: integer } } } }
        trend_30: { type: array, minItems: 31, maxItems: 31, items: { type: object, required: [date, parents, kids, paid, mrr_cad_cents, arpu_cad_cents, churn_30d, retention_pct], properties: { date: { type: string, format: date }, parents: { type: integer }, kids: { type: integer }, paid: { type: integer }, mrr_cad_cents: { type: integer }, arpu_cad_cents: { type: integer }, churn_30d: { type: integer }, retention_pct: { type: number } } } }
    DayValue:
      type: object
      required: [date, value]
      properties:
        date: { type: string, format: date }
        value: { type: integer }
    QuestionStatus:
      type: string
      enum: [draft, review, published, retired]
    QuestionSummary:
      type: object
      required: [id, world, quest, type, status, version]
      properties:
        id: { type: string, example: meteo.pluie.001 }
        world: { type: string }
        quest: { type: string }
        skill: { type: string }
        type: { type: string }
        grade: { type: integer }
        difficulty: { type: integer }
        status: { $ref: '#/components/schemas/QuestionStatus' }
        version: { type: integer }
        author: { type: string }
        ai_drafted: { type: boolean }
        prompt_fr: { type: string }
        prompt_en: { type: string }
        updated_at: { type: string }
    Question:
      type: object
      description: The seed question shape (numerix-api seed/README.md). Free form beyond the listed fields; the validator is the rule.
      additionalProperties: true
      properties:
        id: { type: string }
        quest: { type: string }
        type: { type: string }
        prompt: { type: object, properties: { fr: { type: string }, en: { type: string } } }
        hint: { type: object, properties: { fr: { type: string }, en: { type: string } } }
        answer: { type: object, additionalProperties: true }
        tags: { type: array, items: { type: string } }
    QuestionRecord:
      type: object
      required: [id, status, version, question]
      properties:
        id: { type: string }
        world: { type: string }
        quest: { type: string }
        status: { $ref: '#/components/schemas/QuestionStatus' }
        version: { type: integer }
        content_hash: { type: string }
        ai_drafted: { type: boolean }
        reviewed_by: { type: [string, 'null'] }
        published_at: { type: [string, 'null'] }
        question: { $ref: '#/components/schemas/Question' }
        versions: { type: array, items: { type: object, additionalProperties: true } }
        issues: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } }
    ValidationIssue:
      type: object
      required: [code]
      properties:
        code: { type: string, example: answer_leak }
        field: { type: string }
        message: { type: string }
        warning: { type: boolean }
    ValidationReport:
      type: object
      required: [ok, issues]
      properties:
        ok: { type: boolean }
        issues: { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } }
        unverified: { type: boolean }
        calc_corrections: { type: array, items: { type: object, additionalProperties: true } }
    AdminAsset:
      type: object
      required: [id, licence, media]
      additionalProperties: true
      properties:
        id: { type: string }
        kind: { type: string }
        world: { type: string }
        licence: { type: string }
        review_status: { type: string }
        alt_fr: { type: string }
        alt_en: { type: string }
        media:
          type: object
          properties:
            srcset: { type: array, items: { type: object, properties: { url: { type: string }, w: { type: integer } } } }
