name: deploy-prod

# Production deploy of the web app and the admin app. Starts when a version tag vX.Y.Z is pushed (or by hand).
# A human must press Approve: the job below uses the GitHub Environment "production" with REQUIRED REVIEWERS.
# There is no staging: it builds the archives from the tag, then deploys them to the single production VM.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to deploy, for example v1.0.0 (must be on main)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gate:
    # Safe before any server exists: PROD_APPROVAL_CONFIRMED (repository variable) is empty until the owner has created the
    # production environment with Required reviewers. Empty = skip cleanly (green). Any other value than yes is an error in prepare.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.g.outputs.enabled }}
    steps:
      - id: g
        env:
          CONFIRMED: ${{ vars.PROD_APPROVAL_CONFIRMED }}
        run: |
          if [ -n "$CONFIRMED" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Production deploy skipped::repository variable PROD_APPROVAL_CONFIRMED is empty, so production is not set up yet. Nothing was deployed. See docs/PROD_GO_LIVE.md."
            echo "Production deploy skipped: production is not set up yet (PROD_APPROVAL_CONFIRMED empty)." >> "$GITHUB_STEP_SUMMARY"
          fi

  prepare:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      id: ${{ steps.find.outputs.id }}
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          APPROVAL_CONFIRMED: ${{ vars.PROD_APPROVAL_CONFIRMED }}
        run: |
          set -euo pipefail
          TAG="$PUSHED_TAG"
          if [ "$EVENT" = workflow_dispatch ]; then TAG="$INPUT_TAG"; fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must look like v1.2.3, got '$TAG'"; exit 1; }
          [ "$APPROVAL_CONFIRMED" = yes ] || { echo "::error::set the repository variable PROD_APPROVAL_CONFIRMED to yes only after the production environment has Required reviewers (docs/PROD_GO_LIVE.md, step G2)"; exit 1; }
          git fetch --tags --force origin
          SHA="$(git rev-list -n 1 "refs/tags/$TAG")"
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::tag $TAG is not on main"; exit 1; }
          {
            echo "id=${SHA:0:12}"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying $TAG = commit $SHA" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - id: id
        run: echo "id=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - name: Build the web app archive
        run: bash scripts/release.sh web "${{ steps.id.outputs.id }}"
      - name: Build the admin app archive
        run: |
          (cd admin && npm ci)
          bash scripts/release.sh admin "${{ steps.id.outputs.id }}"
          (cd dist && sha256sum web.tgz admin.tgz > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.id.outputs.id }}
          path: |
            dist/web.tgz
            dist/admin.tgz
            dist/SHA256SUMS
          retention-days: 90
          if-no-files-found: error

  deploy:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      ID: ${{ needs.prepare.outputs.id }}
      WEB_URL: ${{ vars.WEB_URL }}
      ADMIN_URL: ${{ vars.ADMIN_URL }}
      ACTIVATED_COMPONENTS: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.prepare.outputs.id }}
          path: dist
      - uses: ./.github/actions/vm-ssh
        with:
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: Check the settings
        run: |
          [[ "$WEB_URL" == https://* && "$ADMIN_URL" == https://* ]] || { echo "::error::variables WEB_URL and ADMIN_URL must be the https addresses of the production web and admin apps"; exit 1; }
      - name: Verify the archives are exactly what was built
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Install and activate both apps
        run: |
          set -euo pipefail
          for c in web admin; do
            SUM="$(grep " $c.tgz\$" dist/SHA256SUMS | cut -d' ' -f1)"
            # shellcheck disable=SC2029
            ssh nxvm "put $c $ID $SUM" < "dist/$c.tgz"
            # shellcheck disable=SC2029
            if ssh nxvm "activate $c $ID"; then
              ACTIVATED_COMPONENTS="${ACTIVATED_COMPONENTS:+$ACTIVATED_COMPONENTS,}$c"
              echo "ACTIVATED_COMPONENTS=$ACTIVATED_COMPONENTS" >> "$GITHUB_ENV"
            else
              STATUS="$(ssh nxvm status || true)"
              CURRENT="$(printf '%s\n' "$STATUS" | awk -v component="$c" '$1 == component {sub(/^current=/, "", $2); print $2}')"
              if [ "$CURRENT" = "releases/$ID" ]; then
                ACTIVATED_COMPONENTS="${ACTIVATED_COMPONENTS:+$ACTIVATED_COMPONENTS,}$c"
                echo "ACTIVATED_COMPONENTS=$ACTIVATED_COMPONENTS" >> "$GITHUB_ENV"
              fi
              exit 1
            fi
          done
      - name: Roll back if activation failed partway through
        if: failure() && env.ACTIVATED_COMPONENTS != ''
        run: |
          IFS=',' read -r -a components <<< "$ACTIVATED_COMPONENTS"
          for c in "${components[@]}"; do
            STATUS="$(ssh nxvm status || true)"
            CURRENT="$(printf '%s\n' "$STATUS" | awk -v component="$c" '$1 == component {sub(/^current=/, "", $2); print $2}')"
            if [ "$CURRENT" = "releases/$ID" ]; then
              echo "::error::activation of $c release $ID failed; restoring the prior release"
              ssh nxvm "rollback $c"
              ssh nxvm "verify $c" || true
            fi
          done
      - name: Health check, smoke test, automatic rollback
        run: |
          set -uo pipefail
          back() { for c in web admin; do
            # shellcheck disable=SC2029
            ssh nxvm "rollback $c"
            # shellcheck disable=SC2029
            ssh nxvm "verify $c"
          done; }
          for c in web admin; do
            if ! ssh nxvm "verify $c"; then echo "::error::$c never became healthy. Rolling both apps back."; back; exit 1; fi
          done
          if ! bash scripts/smoke-web.sh "$WEB_URL" "$ADMIN_URL"; then
            echo "::error::smoke test failed. Rolling both apps back (the web apps hold no data of their own, so a rollback is always safe)."
            back
            exit 1
          fi
      - name: Summary
        if: always()
        run: |
          {
            echo "### Production deploy of web and admin \`${{ needs.prepare.outputs.tag }}\` (release \`$ID\`)"
            echo "- result: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
