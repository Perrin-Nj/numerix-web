name: deploy-prod

# Production deploy of the web app and the admin app. Starts when a version tag vX.Y.Z is pushed (or by hand).
# A human must press Approve: the job below uses the GitHub Environment "production" with REQUIRED REVIEWERS.
# It ships the archives that deploy-staging.yml built and tested for the same commit. It never rebuilds.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to deploy, for example v1.0.0 (must be on main and must have passed staging)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      id: ${{ steps.find.outputs.id }}
      staging_run: ${{ steps.find.outputs.run }}
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          APPROVAL_CONFIRMED: ${{ vars.PROD_APPROVAL_CONFIRMED }}
        run: |
          set -euo pipefail
          TAG="$PUSHED_TAG"
          if [ "$EVENT" = workflow_dispatch ]; then TAG="$INPUT_TAG"; fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must look like v1.2.3, got '$TAG'"; exit 1; }
          [ "$APPROVAL_CONFIRMED" = yes ] || { echo "::error::set the repository variable PROD_APPROVAL_CONFIRMED to yes only after the production environment has Required reviewers (docs/PROD_GO_LIVE.md, step G2)"; exit 1; }
          git fetch --tags --force origin
          SHA="$(git rev-list -n 1 "refs/tags/$TAG")"
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::tag $TAG is not on main"; exit 1; }
          RUN="$(gh run list --workflow deploy-staging.yml --commit "$SHA" --status success --json databaseId --jq '.[0].databaseId')"
          [ -n "$RUN" ] || { echo "::error::no successful staging deploy for commit $SHA. Merge to main, wait for deploy-staging, then tag."; exit 1; }
          {
            echo "id=${SHA:0:12}"
            echo "run=$RUN"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying $TAG = commit $SHA, archives from staging run $RUN" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      ID: ${{ needs.prepare.outputs.id }}
      WEB_URL: ${{ vars.WEB_URL }}
      ADMIN_URL: ${{ vars.ADMIN_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.prepare.outputs.id }}
          path: dist
          run-id: ${{ needs.prepare.outputs.staging_run }}
          github-token: ${{ github.token }}
      - uses: ./.github/actions/vm-ssh
        with:
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: Check the settings
        run: |
          [[ "$WEB_URL" == https://* && "$ADMIN_URL" == https://* ]] || { echo "::error::variables WEB_URL and ADMIN_URL must be the https addresses of the production web and admin apps"; exit 1; }
      - name: Verify the archives are exactly what staging tested
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Install and activate both apps
        run: |
          set -euo pipefail
          for c in web admin; do
            SUM="$(grep " $c.tgz\$" dist/SHA256SUMS | cut -d' ' -f1)"
            ssh nxvm "put $c $ID $SUM" < "dist/$c.tgz"
            ssh nxvm "activate $c $ID"
          done
      - name: Health check, smoke test, automatic rollback
        run: |
          set -uo pipefail
          back() { for c in web admin; do ssh nxvm "rollback $c"; ssh nxvm "verify $c"; done; }
          for c in web admin; do
            if ! ssh nxvm "verify $c"; then echo "::error::$c never became healthy. Rolling both apps back."; back; exit 1; fi
          done
          if ! bash scripts/smoke-web.sh "$WEB_URL" "$ADMIN_URL"; then
            echo "::error::smoke test failed. Rolling both apps back (the web apps hold no data of their own, so a rollback is always safe)."
            back
            exit 1
          fi
      - name: Summary
        if: always()
        run: |
          {
            echo "### Production deploy of web and admin \`${{ needs.prepare.outputs.tag }}\` (release \`$ID\`)"
            echo "- result: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
