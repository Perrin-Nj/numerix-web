name: Keep alive
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # KEEPALIVE_URLS: space-separated health URLs. Empty means no pings.
      - name: Ping configured health URLs
        env:
          KEEPALIVE_URLS: ${{ vars.KEEPALIVE_URLS }}
        run: node scripts/keepalive.mjs
