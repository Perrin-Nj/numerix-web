name: Keep alive
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # KEEPALIVE_URLS: space-separated health URLs. Empty means no pings.
      - name: Ping configured health URLs
        env:
          KEEPALIVE_URLS: ${{ vars.KEEPALIVE_URLS }}
        run: node scripts/keepalive.mjs
