name: Keep alive
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # KEEPALIVE_URLS: space-separated health URLs. Empty means no pings.
      - name: Ping configured health URLs
        env:
          KEEPALIVE_URLS: ${{ vars.KEEPALIVE_URLS }}
        run: node scripts/keepalive.mjs
